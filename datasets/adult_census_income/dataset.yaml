name: adult_census_income
loader: ludwig
loader_args:
  module: adult_census_income
task: binary_classification
primary_metric: roc_auc
primary_output: income
minimize: false

input_features:
  - name: age
    type: number
  - name: workclass
    type: category
  - name: fnlwgt
    type: number
  - name: education
    type: category
  - name: education-num
    type: number
  - name: marital-status
    type: category
  - name: occupation
    type: category
  - name: relationship
    type: category
  - name: race
    type: category
  - name: sex
    type: category
  - name: capital-gain
    type: number
  - name: capital-loss
    type: number
  - name: hours-per-week
    type: number
  - name: native-country
    type: category

output_features:
  - name: income
    type: binary
