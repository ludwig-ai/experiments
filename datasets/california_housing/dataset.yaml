  - name: HouseAge
    type: number
  - name: AveRooms
    type: number
  - name: AveBedrms
    type: number
  - name: Population
    type: number
  - name: AveOccup
    type: number
  - name: Latitude
    type: number
  - name: Longitude
    type: number

output_features:
  - name: target
    type: number
