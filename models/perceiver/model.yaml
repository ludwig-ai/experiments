name: perceiver
description: "PerceiverCombiner (Jaegle et al., ICML 2022) — latent bottleneck cross-attention"

combiner:
  type: perceiver
  latent_dim: 128
  num_latents: 32
  num_heads: 8
  num_self_attention_layers: 2
  dropout: 0.1
  output_size: 128

trainer:
  learning_rate: 0.0001
  batch_size: 256
  epochs: 200
  early_stop: 16
  evaluate_training_set: false
  optimizer:
    type: adamw
    weight_decay: 0.00001
