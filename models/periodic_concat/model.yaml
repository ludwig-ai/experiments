name: periodic_concat
description: "Periodic encoder (Gorishniy et al., NeurIPS 2022) + ConcatCombiner"

combiner:
  type: concat
  num_fc_layers: 3
  output_size: 128
  activation: relu
  dropout: 0.1

trainer:
  learning_rate: 0.001
  batch_size: 256
  epochs: 200
  early_stop: 16
  evaluate_training_set: false
  optimizer:
    type: adam

encoder_overrides:
  number:
    type: periodic
    num_frequencies: 64
    output_size: 128
