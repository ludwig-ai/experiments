name: gated_fusion
description: "GatedFusionCombiner (Flamingo-inspired) — gated cross-modal residuals"

combiner:
  type: gated_fusion
  hidden_size: 128
  dropout: 0.1
  output_size: 128

trainer:
  learning_rate: 0.0001
  batch_size: 256
  epochs: 200
  early_stop: 16
  evaluate_training_set: false
  optimizer:
    type: adamw
    weight_decay: 0.00001
